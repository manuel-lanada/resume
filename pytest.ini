[pytest]
testpaths = tests
pythonpath = .
# The default run is fast and offline. Opt in to the rest with `-m integration`
# or `-m live` (see the markers below).
addopts = -ra -m "not integration and not live"
markers =
    integration: loads the real embedding model (downloads about 90 MB the first time)
    live: sends a real request to Gemini with your GEMINI_API_KEY (uses quota)
